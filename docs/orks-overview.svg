<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1180" viewBox="0 0 880 1180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7aa2f7"/>
    </marker>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7a99"/>
    </marker>
    <style>
      .h1 { font-size: 26px; font-weight: 700; fill: #e6edf3; letter-spacing: 1px; }
      .sub { font-size: 15px; fill: #aab4c3; }
      .step { font-size: 16px; font-weight: 700; fill: #e6edf3; }
      .num { fill: #f0883e; }
      .body { fill: #aab4c3; font-size: 13px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; }
      .mono-sm { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #aab4c3; }
      .key { fill: #f0883e; }
      .kw { fill: #7aa2f7; }
      .str { fill: #9ece6a; }
      .box { fill: #161b27; stroke: #2d3748; stroke-width: 1.2; }
      .box-hdr { fill: #1f2636; }
      .tag { fill: #0f141f; stroke: #3b4a66; }
      .edge { stroke: #7aa2f7; stroke-width: 1.6; fill: none; }
      .edge-dim { stroke: #6b7a99; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .state { fill: #0f141f; stroke-width: 1.6; }
      .lbl { font-size: 12px; fill: #8b96ab; }
      .ok { fill: #3fb950; }
      .warn { fill: #e3b341; }
      .bad { fill: #f85149; }
    </style>
  </defs>

  <rect width="880" height="1180" fill="#0d1117"/>

  <!-- Title -->
  <text x="440" y="54" text-anchor="middle" class="h1">OPEN REVOCABLE KEY STANDARD (ORKS)</text>
  <line x1="150" y1="68" x2="730" y2="68" stroke="#2d3748"/>
  <text x="440" y="92" text-anchor="middle" class="sub">A leaked API key is attributed, discovered, and neutralized by anyone holding it —</text>
  <text x="440" y="112" text-anchor="middle" class="sub">in seconds, with no prior relationship to the issuer.</text>

  <!-- ===== Step 1: Leak detected ===== -->
  <g transform="translate(40,130)">
    <rect width="300" height="130" rx="8" class="box"/>
    <rect width="300" height="28" rx="8" class="box-hdr"/>
    <rect y="14" width="300" height="14" class="box-hdr"/>
    <circle cx="16" cy="14" r="4" fill="#ff5f57"/><circle cx="30" cy="14" r="4" fill="#febc2e"/><circle cx="44" cy="14" r="4" fill="#28c840"/>
    <text x="150" y="19" text-anchor="middle" class="mono-sm">public repo · config.js</text>
    <text x="16" y="54" class="mono-sm">const API_KEY =</text>
    <rect x="12" y="64" width="276" height="26" rx="4" fill="#1c1410" stroke="#f0883e" stroke-width="1.2"/>
    <text x="150" y="82" text-anchor="middle" class="mono key">orks_api.example.com_4Zq9…_15KzgI</text>
    <text x="16" y="112" class="mono-sm">fetch(url, { headers: { ... } })</text>
  </g>
  <text x="40" y="288" class="step"><tspan class="num">1.</tspan> Leak detected</text>
  <text x="40" y="308" class="body">A scanner, the owner, or a stranger finds the string.</text>
  <text x="40" y="326" class="body">CRC-32 check validates offline — no false positives.</text>

  <!-- arrow step 1 → 2 -->
  <path d="M345,195 L405,195" class="edge" marker-end="url(#arr)"/>

  <!-- ===== Step 2: Anatomy / attribution ===== -->
  <g transform="translate(410,130)">
    <rect width="430" height="130" rx="8" class="box"/>
    <text x="16" y="26" class="step" font-size="14">Anatomy of an ORKS key (§3)</text>
    <!-- segments -->
    <g transform="translate(16,42)">
      <rect width="70" height="30" rx="4" class="tag"/>
      <text x="35" y="20" text-anchor="middle" class="mono">orks</text>
      <text x="76" y="20" class="mono" fill="#6b7a99">_</text>
      <rect x="86" width="128" height="30" rx="4" class="tag"/>
      <text x="150" y="20" text-anchor="middle" class="mono kw">issuer</text>
      <text x="218" y="20" class="mono" fill="#6b7a99">_</text>
      <rect x="228" width="100" height="30" rx="4" class="tag"/>
      <text x="278" y="20" text-anchor="middle" class="mono">secret</text>
      <text x="332" y="20" class="mono" fill="#6b7a99">_</text>
      <rect x="342" width="56" height="30" rx="4" class="tag"/>
      <text x="370" y="20" text-anchor="middle" class="mono">check</text>
    </g>
    <text x="51" y="92" text-anchor="middle" class="lbl">literal prefix</text>
    <text x="51" y="106" text-anchor="middle" class="lbl">[-vendor tag]</text>
    <text x="166" y="92" text-anchor="middle" class="lbl">issuer's domain,</text>
    <text x="166" y="106" text-anchor="middle" class="lbl">in the clear</text>
    <text x="294" y="92" text-anchor="middle" class="lbl">≥128-bit CSPRNG</text>
    <text x="294" y="106" text-anchor="middle" class="lbl">base62 (27 rec.)</text>
    <text x="386" y="92" text-anchor="middle" class="lbl">CRC-32</text>
    <text x="386" y="106" text-anchor="middle" class="lbl">6×base62</text>
  </g>
  <text x="410" y="288" class="step"><tspan class="num">2.</tspan> Attribution (self-identifying key)</text>
  <text x="410" y="308" class="body">The issuer domain is read straight out of the key. No lookup table,</text>
  <text x="410" y="326" class="body">no partner program — the key itself says where to go.</text>

  <!-- arrow from issuer segment down to discovery -->
  <path d="M840,195 L862,195 L862,405 L785,405 L785,418" class="edge" marker-end="url(#arr)"/>
  <text x="866" y="300" class="lbl" transform="rotate(90 866 300)">issuer segment → api.example.com</text>

  <!-- ===== Step 3: Discovery ===== -->
  <text x="440" y="400" text-anchor="middle" class="step"><tspan class="num">3.</tspan> Discovery (§4)</text>

  <!-- Client icon (left) -->
  <g transform="translate(50,430)">
    <rect width="90" height="56" rx="5" fill="#0f141f" stroke="#3b4a66" stroke-width="1.4"/>
    <rect x="-8" y="56" width="106" height="8" rx="2" fill="#1f2636" stroke="#3b4a66"/>
    <text x="45" y="90" text-anchor="middle" class="body">Reporter</text>
    <text x="45" y="106" text-anchor="middle" class="lbl">(scanner / owner / anyone)</text>
  </g>
  <!-- Provider icon (right) -->
  <g transform="translate(740,420)">
    <rect width="90" height="76" rx="5" fill="#0f141f" stroke="#3b4a66" stroke-width="1.4"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f57"/><circle cx="26" cy="12" r="3" fill="#febc2e"/><circle cx="37" cy="12" r="3" fill="#28c840"/>
    <text x="45" y="42" text-anchor="middle" class="mono" fill="#7aa2f7">&lt;/&gt;</text>
    <text x="45" y="62" text-anchor="middle" class="mono-sm">issuer</text>
    <text x="45" y="100" text-anchor="middle" class="body">api.example.com</text>
  </g>

  <!-- GET request box -->
  <g transform="translate(170,420)">
    <rect width="540" height="30" rx="6" class="tag"/>
    <text x="12" y="20" class="mono"><tspan class="kw">GET</tspan> https://<tspan class="key">api.example.com</tspan>/.well-known/api-key-config</text>
  </g>
  <path d="M150,435 L168,435" class="edge"/>
  <path d="M712,435 L738,435" class="edge" marker-end="url(#arr)"/>

  <!-- Response doc -->
  <g transform="translate(170,462)">
    <rect width="540" height="98" rx="6" class="box"/>
    <text x="12" y="20" class="mono-sm">200 · application/json</text>
    <text x="12" y="40" class="mono">{ <tspan class="str">"revocation_endpoint"</tspan>: <tspan class="str">"https://api.example.com/orks/revoke"</tspan>,</text>
    <text x="24" y="58" class="mono"><tspan class="str">"revocation_modes"</tspan>: [<tspan class="str">"immediate"</tspan>, <tspan class="str">"quarantine"</tspan>],</text>
    <text x="24" y="76" class="mono"><tspan class="str">"quarantine_delay_seconds"</tspan>: 86400, <tspan class="str">"security_contact"</tspan>: … }</text>
    <text x="528" y="92" text-anchor="end" class="lbl">TLS · cacheable ≥1h · optional report_endpoint / introspection_endpoint</text>
  </g>
  <path d="M738,511 L712,511" class="edge" marker-end="url(#arr)"/>
  <path d="M168,511 L150,511" class="edge" marker-end="url(#arr)"/>

  <!-- ===== Step 4: Revocation ===== -->
  <text x="440" y="620" text-anchor="middle" class="step"><tspan class="num">4.</tspan> Revocation (§5)</text>

  <g transform="translate(50,650)">
    <rect width="90" height="56" rx="5" fill="#0f141f" stroke="#3b4a66" stroke-width="1.4"/>
    <rect x="-8" y="56" width="106" height="8" rx="2" fill="#1f2636" stroke="#3b4a66"/>
    <text x="45" y="90" text-anchor="middle" class="body">Reporter</text>
  </g>
  <g transform="translate(740,640)">
    <rect width="90" height="76" rx="5" fill="#0f141f" stroke="#3b4a66" stroke-width="1.4"/>
    <circle cx="15" cy="12" r="3" fill="#ff5f57"/><circle cx="26" cy="12" r="3" fill="#febc2e"/><circle cx="37" cy="12" r="3" fill="#28c840"/>
    <text x="45" y="42" text-anchor="middle" class="mono" fill="#7aa2f7">&lt;/&gt;</text>
    <text x="45" y="62" text-anchor="middle" class="mono-sm">issuer</text>
  </g>

  <!-- POST -->
  <g transform="translate(170,640)">
    <rect width="540" height="78" rx="6" class="tag"/>
    <text x="12" y="20" class="mono"><tspan class="kw">POST</tspan> /orks/revoke   <tspan class="lbl">— no authentication; full key REQUIRED</tspan></text>
    <text x="12" y="40" class="mono">{ <tspan class="str">"key"</tspan>: <tspan class="key">"orks_api.example.com_4Zq9…_15KzgI"</tspan>, <tspan class="str">"mode"</tspan>: <tspan class="str">"quarantine"</tspan>,</text>
    <text x="24" y="58" class="mono"><tspan class="str">"reason"</tspan>: <tspan class="str">"found_in_public_repository"</tspan>, <tspan class="str">"evidence_url"</tspan>: <tspan class="str">"…"</tspan> }</text>
  </g>
  <path d="M150,679 L168,679" class="edge"/>
  <path d="M712,679 L738,679" class="edge" marker-end="url(#arr)"/>

  <!-- Response -->
  <g transform="translate(170,730)">
    <rect width="540" height="78" rx="6" class="box"/>
    <text x="12" y="20" class="mono"><tspan class="ok">200 OK</tspan>   <tspan class="lbl">— identical for unknown / already-revoked keys (no validity oracle)</tspan></text>
    <text x="12" y="40" class="mono">{ <tspan class="str">"status"</tspan>: <tspan class="str">"accepted"</tspan>, <tspan class="str">"mode_applied"</tspan>: <tspan class="str">"quarantine"</tspan>,</text>
    <text x="24" y="58" class="mono"><tspan class="str">"hard_revoke_at"</tspan>: <tspan class="str">"2026-07-04T18:00:00Z"</tspan> }</text>
  </g>
  <path d="M738,769 L712,769" class="edge" marker-end="url(#arr)"/>
  <path d="M168,769 L150,769" class="edge" marker-end="url(#arr)"/>

  <text x="440" y="828" text-anchor="middle" class="body">Possession implies revocation right — only a party who could already abuse the key can revoke it. Rate-limited.</text>

  <!-- ===== Step 5: Key lifecycle ===== -->
  <text x="440" y="854" text-anchor="middle" class="step"><tspan class="num">5.</tspan> Outcome — key state machine (§6)</text>

  <!-- ACTIVE -->
  <g transform="translate(60,900)">
    <rect width="130" height="44" rx="22" class="state" stroke="#3fb950"/>
    <text x="65" y="27" text-anchor="middle" class="mono" font-weight="700">ACTIVE</text>
  </g>
  <!-- QUARANTINED -->
  <g transform="translate(345,900)">
    <rect width="190" height="44" rx="22" class="state" stroke="#e3b341"/>
    <text x="95" y="27" text-anchor="middle" class="mono" font-weight="700">QUARANTINED</text>
  </g>
  <!-- REVOKED -->
  <g transform="translate(690,900)">
    <rect width="130" height="44" rx="22" class="state" stroke="#f85149"/>
    <text x="65" y="27" text-anchor="middle" class="mono" font-weight="700">REVOKED</text>
  </g>

  <!-- ACTIVE → QUARANTINED -->
  <path d="M190,922 L343,922" class="edge" marker-end="url(#arr)"/>
  <text x="266" y="958" text-anchor="middle" class="lbl">mode: quarantine (default for strangers)</text>
  <!-- QUARANTINED → REVOKED -->
  <path d="M535,922 L688,922" class="edge" marker-end="url(#arr)"/>
  <text x="612" y="958" text-anchor="middle" class="lbl">timer expires (≤72h, 24h rec.)</text>
  <!-- ACTIVE → REVOKED (immediate) over the top -->
  <path d="M125,900 C125,872 755,872 755,898" class="edge" marker-end="url(#arr)"/>
  <text x="440" y="874" text-anchor="middle" class="lbl" fill="#7aa2f7">mode: immediate (authenticated owner, or self_revoke keys)</text>
  <!-- QUARANTINED → ACTIVE (owner cancels) under -->
  <path d="M400,944 C400,1000 160,1000 160,946" class="edge-dim" marker-end="url(#arr-dim)"/>
  <text x="280" y="1008" text-anchor="middle" class="lbl">owner cancels + acknowledges evidence (human only, §11.10)</text>
  <!-- QUARANTINED → REVOKED (owner expedites) under -->
  <path d="M480,944 C480,1000 720,1000 720,946" class="edge-dim" marker-end="url(#arr-dim)"/>
  <text x="600" y="1008" text-anchor="middle" class="lbl">owner expedites</text>

  <!-- quarantine detail -->
  <g transform="translate(300,1030)">
    <rect width="280" height="72" rx="6" class="box" stroke="#e3b341" stroke-opacity="0.5"/>
    <text x="140" y="20" text-anchor="middle" class="body" fill="#e3b341" font-weight="700">While quarantined</text>
    <text x="140" y="40" text-anchor="middle" class="lbl">owner notified immediately (reason, evidence, deadline)</text>
    <text x="140" y="56" text-anchor="middle" class="lbl">restrictions applied: read-only · rate-limited · no destructive ops</text>
  </g>
  <text x="125" y="1070" text-anchor="middle" class="body"><tspan class="ok" font-weight="700">✓</tspan> Leak neutralized</text>
  <text x="125" y="1088" text-anchor="middle" class="lbl">no email, no ticket, no waiting</text>
  <text x="755" y="1070" text-anchor="middle" class="body"><tspan class="bad" font-weight="700">■</tspan> Hard-revoked</text>
  <text x="755" y="1088" text-anchor="middle" class="lbl">never an indefinite restricted state</text>

  <!-- Footer -->
  <line x1="40" y1="1130" x2="840" y2="1130" stroke="#2d3748"/>
  <text x="440" y="1156" text-anchor="middle" class="mono-sm">Draft v0.2 · github.com/6d6b68/ORKS · section refs (§) point to README.md</text>
</svg>
